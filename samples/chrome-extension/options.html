<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OriLang Extension Options</title>
<style>
  body { font-family:'Segoe UI',sans-serif; max-width:600px; margin:40px auto;
         padding:20px; color:#333; }
  h1 { font-size:24px; border-bottom:2px solid #4a90d9; padding-bottom:10px; }
  label { display:block; margin:16px 0 6px; font-weight:600; }
  input, select { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;
                  font-size:14px; box-sizing:border-box; }
  button { background:#4a90d9; color:#fff; border:none; padding:12px 24px;
           border-radius:6px; cursor:pointer; font-size:14px; margin-top:20px; }
  button:hover { background:#3a7bc8; }
  .status { margin-top:16px; padding:10px; border-radius:6px; display:none; }
  .success { background:#e8f5e9; color:#2e7d32; }
  .error { background:#ffebee; color:#c62828; }
</style>
</head>
<body>
  <h1>OriLang Extension — Settings</h1>

  <label for="apiUrl">API Endpoint URL</label>
  <input type="text" id="apiUrl" placeholder="https://api.example.com/v1" />

  <label for="theme">Theme</label>
  <select id="theme">
    <option value="auto">System Default</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>

  <label for="maxResults">Max Results</label>
  <input type="number" id="maxResults" min="1" max="100" value="10" />

  <button id="save">Save Settings</button>
  <div id="statusMsg" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
